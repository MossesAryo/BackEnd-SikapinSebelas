name: Deploy Laravel to VPS

on:
  push:
    branches:
      - main-local

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
              cd ~/web/sjuwara.student.smkn11bdg.sch.id/public_html/BackEnd-SikapinSebelas

              git fetch origin
              git reset --hard origin/main-local

              php8.3 /usr/bin/composer install --no-dev --optimize-autoloader

              php8.3 artisan down || true

               php8.3 artisan migrate --force
               php8.3 artisan config:cache
               php8.3 artisan route:cache
                php8.3 artisan view:cache

               rsync -av --delete ./ /home/IDN2306510507/web/sjuwara.student.smkn11bdg.sch.id/public_html/BackEnd-SikapinSebelas/

               php8.3 artisan up
